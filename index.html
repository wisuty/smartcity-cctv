<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Smart City Ratchaburi (Full Edition)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2>เข้าสู่ระบบ</h2>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button class="btn-primary" onclick="attemptLogin()">Login</button>
        </div>
    </div>

    <header class="main-header">
        <h2>🐉 Smart City ราชบุรี (Full Version)</h2>
        <div id="user-profile" style="display: none;">
            <button onclick="logout()">Logout</button>
        </div>
    </header>

    <div id="dashboard-window" class="window">
        <div class="window-header" onmousedown="dragElement(this.parentElement)">📊 สถิติ PM2.5</div>
        <div class="window-body">
            <canvas id="pm25Chart"></canvas>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
