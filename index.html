<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Smart City Command Center - Ratchaburi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2>Login</h2>
            <div class="input-group"><label>Username</label><input type="text" id="login-username"></div>
            <div class="input-group"><label>Password</label><input type="password" id="login-password"></div>
            <div id="login-error" style="color:red; display:none;"></div>
            <button class="btn-primary" onclick="attemptLogin()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <header class="main-header">
        <h2>🐉 Smart City ราชบุรี (V11)</h2>
        <div id="user-profile" style="display: none;">
            👤 <span id="current-username"></span>
            <button class="btn-delete" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar-menu" id="sidebar">
            <button class="menu-item active" onclick="switchPage('dashboard', this)">🗺️ Dashboard</button>
            <button class="menu-item" onclick="switchPage('settings', this)">🛠️ ตั้งค่า</button>
        </nav>

        <div id="page-dashboard" class="page-content active-page">
            <div id="ai-alerts-box" style="width:100%;"></div>
        </div>

        <div id="page-users" class="page-content">
            <h2 class="page-title">👤 จัดการผู้ใช้งาน</h2>
            <div style="margin-bottom: 20px;">
                <input type="text" id="new-user-name" placeholder="ชื่อ">
                <input type="text" id="new-user-id" placeholder="User">
                <input type="password" id="new-user-pass" placeholder="Pass">
                <select id="new-user-role"><option value="viewer">Viewer</option><option value="admin">Admin</option></select>
                <button class="btn-primary" onclick="addUser()">+ เพิ่ม</button>
            </div>
            <table class="styled-table"><tbody id="user-table-body"></tbody></table>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
