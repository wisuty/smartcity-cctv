<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Smart City Ratchaburi V11.2</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-overlay" class="login-overlay"><div class="login-box"><h2>Login</h2><input type="text" id="login-username" placeholder="User"><input type="password" id="login-password" placeholder="Pass"><button class="btn-primary" onclick="attemptLogin()">เข้าสู่ระบบ</button></div></div>
    
    <header class="main-header">
        <h2>🐉 Smart City ราชบุรี (Full System)</h2>
        <div id="user-profile" style="display:none">👤 <span id="current-username"></span> <button onclick="logout()">Logout</button></div>
    </header>

    <div class="main-layout">
        <nav class="sidebar-menu" id="sidebar">
            <button class="menu-item active" onclick="switchPage('dashboard')">🗺️ Dashboard</button>
            <button class="menu-item" onclick="switchPage('settings')">⚙️ อุปกรณ์</button>
            <button class="menu-item" id="admin-menu" style="display:none" onclick="switchPage('users')">👤 จัดการผู้ใช้</button>
        </nav>
        
        <div id="page-dashboard" class="page-content active-page">
            <div id="map"></div>
            <div id="draggable-win" class="window"><div class="window-header">🚨 AI Alerts</div><div class="window-body" id="ai-alerts-box"></div></div>
        </div>
        
        <div id="page-settings" class="page-content"><table class="styled-table"><tbody id="device-tbody"></tbody></table></div>
        <div id="page-users" class="page-content">
            <div class="user-form"><input type="text" id="new-user-name" placeholder="ชื่อ"><input type="text" id="new-user-id" placeholder="User"><button onclick="addUser()">เพิ่ม</button></div>
            <table class="styled-table"><tbody id="user-table-body"></tbody></table>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
